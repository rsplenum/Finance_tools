name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04 # ubuntu-latest moves to 26.04 from 19-10-2026; Playwright 1.56 has no deps list for it (D-TECH-60)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run rules-doc -- --check
      - run: npm run build
      - run: npm run worker:build
      - run: npx playwright install --with-deps chromium
      - run: npm run check:site
